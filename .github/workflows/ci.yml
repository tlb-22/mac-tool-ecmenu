name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODE_DESTINATION: platform=macOS,arch=arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Import Apple Development certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::Configure BUILD_CERTIFICATE_BASE64 and P12_PASSWORD repository secrets."
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/build-certificate.p12"
          keychain_path="$RUNNER_TEMP/ecmenu-ci.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" \
            | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Check AppIcon resources
        run: ./scripts/generate-app-icon.sh --check

      - name: Run tests
        run: ./scripts/test.sh

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            .artifacts/scratch/logs/
            .artifacts/scratch/tests/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
