<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1024"
    height="1024"
    viewBox="0 0 1024 1024"
>
    <defs>
        <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2B97FF" />
            <stop offset="0.52" stop-color="#0A84FF" />
            <stop offset="1" stop-color="#0878E8" />
        </linearGradient>
    </defs>

    <view
        id="settings-app-icon-view"
        viewBox="116 116 792 792"
    />

    <g id="background-layer" fill="#232427">
        <rect
            x="0"
            y="0"
            width="1024"
            height="1024"
        />
    </g>

    <g
        id="click-wave-layer"
        transform="translate(512 512) scale(1.20) translate(-512 -512)"
        fill="none"
        stroke="url(#accent)"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path
            d="M 512 767 A 255 255 0 1 1 767 512"
            stroke-width="50"
        />
        <path
            d="M 487 655 A 145 145 0 1 1 655 487"
            stroke-width="50"
        />
    </g>

    <g
        id="pointer-layer"
        transform="translate(512 512) scale(1.20) translate(-512 -512)"
    >
        <g transform="translate(500 500) rotate(45) scale(1.20)">
            <!-- 外侧凸角使用同一圆角半径；直线肩部两端保留锐利内角并使用较小半径。 -->
            <path
                d="M 34.09 -16.25 L 178.67 -85.16 A 18 18 0 0 1 203.79 -64.21 L 196.04 -35.57 A 6 6 0 0 0 201.84 -28 L 262 -28 A 18 18 0 0 1 280 -10 L 280 10 A 18 18 0 0 1 262 28 L 201.84 28 A 6 6 0 0 0 196.04 35.57 L 203.79 64.21 A 18 18 0 0 1 178.67 85.16 L 34.09 16.25 A 18 18 0 0 1 34.09 -16.25 Z"
                fill="#EDEEF0"
                stroke="#17181B"
                stroke-width="12"
                stroke-linejoin="round"
            />
        </g>
    </g>
</svg>
